name: New metro project
description: Propose a metro project for the public record.
title: "[New metro project] "
body:
  - type: markdown
    attributes:
      value: "Reports are public. Submit one public source and its metadata. The bot prepares the data; a maintainer checks the evidence. Unknown costs, dates, and routes are fine."
  - type: input
    id: contribution-type
    attributes: { label: Contribution type, value: New metro project }
    validations: { required: true }
  - type: input
    id: name
    attributes:
      label: Project name and phase or line
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: City and state or Union Territory
    validations:
      required: true
  - type: input
    id: agency
    attributes:
      label: Responsible agency, if known
  - type: textarea
    id: scope
    attributes:
      label: What does this project record cover?
      description: Describe the exact line, extension, or construction phase.
    validations:
      required: true
  - type: input
    id: source-url
    attributes: { label: Public source URL }
    validations: { required: true }
  - type: input
    id: source-title
    attributes: { label: Source title }
    validations: { required: true }
  - type: input
    id: source-publisher
    attributes: { label: Source publisher }
    validations: { required: true }
  - type: dropdown
    id: source-type
    attributes: { label: Source type, options: [primary, reporting, field] }
    validations: { required: true }
  - type: input
    id: source-date
    attributes:
      { label: Source publication date (optional), placeholder: YYYY-MM-DD }
  - type: input
    id: source-section
    attributes: { label: Source section or page (optional) }
  - type: textarea
    id: source-proof
    attributes: { label: "What does this source establish?" }
    validations: { required: true }
  - type: textarea
    id: route
    attributes:
      label: Optional route proposal or reference
      description: Paste GeoJSON from TrackYourInfra's route editor if you drew a line.
  - type: dropdown
    id: route_permission
    attributes:
      label: Permission to display a submitted route
      description: A submitted line is shown as an unverified community proposal only if you created the points yourself and grant permission to publish them under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Do not trace a third-party map unless its terms allow this.
      options:
        - No route submitted
        - I created these route points and license them under CC BY 4.0
      default: 0
    validations:
      required: true
