name: Project update
description: Suggest one sourced change to an existing metro project. No code edits needed.
title: "[Project update] "
body:
  - type: markdown
    attributes:
      value: "Change one project fact with a public source. Valid submissions are published automatically and marked as community-submitted."
  - type: input
    id: project-id
    attributes:
      {
        label: Project ID,
        description: "The ID at the end of the project URL, e.g. bengaluru-purple-line.",
      }
    validations: { required: true }
  - type: dropdown
    id: field
    attributes:
      label: Field to update
      options:
        [
          status,
          routeLengthKm,
          stationCount,
          approvedCostCrore,
          latestCostCrore,
          originalTarget,
          currentTarget,
          progressPercent,
          name,
          scopeDescription,
          summary,
        ]
    validations: { required: true }
  - type: input
    id: value
    attributes:
      {
        label: New value (or Unknown),
        description: "Dates use YYYY-MM-DD. Status uses the site's status values. Unknown clears a published value.",
      }
    validations: { required: true }
  - type: input
    id: as-of
    attributes: { label: Claim as-of date, placeholder: YYYY-MM-DD }
    validations: { required: true }
  - type: input
    id: source-url
    attributes: { label: Public source URL }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: "What does this source establish?" }
    validations: { required: true }
