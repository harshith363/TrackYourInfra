name: Automated data contributions
on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: public-data-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.body, '### Public source URL')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: public-data
          path: .published-data
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Load the latest published records
        run: |
          cp -R .published-data/data/projects/. data/projects/
          cp -R .published-data/data/sources/. data/sources/
          cp .published-data/data/changes.json data/changes.json
      - name: Generate data-only change from the issue form
        id: contribution
        env:
          TRACKYOURINFRA_DATA_MODE: real
        run: node --import tsx scripts/prepare-contribution.ts
      - name: Validate exact proposed site and data
        env:
          TRACKYOURINFRA_DATA_MODE: real
        run: |
          npm run validate
          npm test
          npm run check
          npm run build
      - name: Commit the validated data to the public-data branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.contribution.outputs.issue_number }}
          ISSUE_HASH: ${{ steps.contribution.outputs.issue_hash }}
          CONTRIBUTION_KIND: ${{ steps.contribution.outputs.kind }}
          PROJECT_PATH: ${{ steps.contribution.outputs.project_path }}
          SOURCE_PATH: ${{ steps.contribution.outputs.source_path }}
        run: |
          cp "$PROJECT_PATH" ".published-data/$PROJECT_PATH"
          if [ -n "$SOURCE_PATH" ]; then cp "$SOURCE_PATH" ".published-data/$SOURCE_PATH"; fi
          cp data/changes.json .published-data/data/changes.json
          git -C .published-data add data/projects data/sources data/changes.json
          node --import tsx scripts/verify-data-publication.ts
          git -C .published-data config user.name 'github-actions[bot]'
          git -C .published-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .published-data commit -m "Publish data from issue #${ISSUE_NUMBER}" -m "Issue SHA256: ${ISSUE_HASH}"
          git -C .published-data push origin HEAD:public-data
          sha="$(git -C .published-data rev-parse HEAD)"
          gh label create 'contribution:recorded' --repo "$GITHUB_REPOSITORY" --color '0e8a16' --description 'Validated contribution committed to public-data' --force
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'contribution:recorded'
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Validated data was committed to the public-data branch at $sha. The source claim has not been independently verified. The website reflects it after the next real-data build or deployment."
          echo "Recorded issue #${ISSUE_NUMBER} in public-data at $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain a failed submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ERROR: ${{ steps.contribution.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$ERROR" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Automated checks need a correction: $ERROR. Edit the issue form to retry. Details: $RUN_URL"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Automatic publication did not complete. Check the workflow and edit or reopen the issue to retry: $RUN_URL"
          fi
