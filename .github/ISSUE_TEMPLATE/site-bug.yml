name: Website bug
description: Report a problem with the website or route editor.
title: "[Website bug] "
body:
  - type: input
    id: page
    attributes:
      label: Page or URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device, if relevant
