name: Map correction
description: Submit a drawn route for an existing metro project. No code edits needed.
title: "[Map correction] "
body:
  - type: markdown
    attributes:
      value: "Draw a route at /contribute/map/ and paste its GeoJSON. A community proposal remains unverified after publication."
  - type: input
    id: project-id
    attributes: { label: Project ID }
    validations: { required: true }
  - type: markdown
    attributes:
      value: "Submitted routes are displayed only as dashed, unverified community proposals. This form cannot replace an accepted alignment."
  - type: textarea
    id: geojson
    attributes: { label: Route editor GeoJSON, render: json }
    validations: { required: true }
  - type: dropdown
    id: license
    attributes:
      label: Route license declaration
      options:
        [
          I cannot grant route publication permission,
          I created these route points and license them under CC BY 4.0,
        ]
    validations: { required: true }
  - type: input
    id: source-url
    attributes: { label: Public source URL }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: "What does this source establish?" }
    validations: { required: true }
