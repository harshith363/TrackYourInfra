name: Prepare issue draft PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  prepare:
    if: github.event.label.name == 'automation:prepare-draft-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Check for an existing branch or PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="automation/issue-${ISSUE_NUMBER}-project"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Draft already exists: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$branch" >/dev/null; then
            echo "Branch $branch exists without a PR. Resolve manually to preserve edits." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.existing.outputs.skip != 'true'
      - name: Prepare draft data from supported issue form
        if: steps.existing.outputs.skip != 'true'
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKYOURINFRA_DATA_MODE: real
        run: node --import tsx scripts/prepare-issue-pr.ts
      - name: Validate generated data and site
        if: steps.existing.outputs.skip != 'true'
        env:
          TRACKYOURINFRA_DATA_MODE: real
        run: |
          npm run validate
          npm test
          npm run check
          npm run build
      - name: Commit and open draft PR
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          BODY_PATH: ${{ steps.draft.outputs.body_path }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects data/sources data/changes.json
          git commit -m "Prepare project draft for issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_PATH"
