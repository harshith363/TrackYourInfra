name: Source addition or correction
description: Add or correct a public source for an existing metro project. No code edits needed.
title: "[Source] "
body:
  - type: input
    id: contribution-type
    attributes: { label: Contribution type, value: Source addition }
    validations: { required: true }
  - type: input
    id: project-id
    attributes: { label: Project ID }
    validations: { required: true }
  - type: dropdown
    id: source-action
    attributes:
      {
        label: Source action,
        options: [Add new source, Correct existing source],
      }
    validations: { required: true }
  - type: input
    id: existing-source-id
    attributes:
      {
        label: Existing source ID (for corrections),
        description: "Find this in the source register on the project page. Leave blank when adding a source.",
      }
  - type: input
    id: source-url
    attributes: { label: Public source URL }
    validations: { required: true }
  - type: input
    id: source-title
    attributes: { label: Source title }
    validations: { required: true }
  - type: input
    id: source-publisher
    attributes: { label: Source publisher }
    validations: { required: true }
  - type: dropdown
    id: source-type
    attributes: { label: Source type, options: [primary, reporting, field] }
    validations: { required: true }
  - type: input
    id: source-date
    attributes:
      { label: Source publication date (optional), placeholder: YYYY-MM-DD }
  - type: input
    id: source-section
    attributes: { label: Source section or page (optional) }
  - type: textarea
    id: evidence
    attributes: { label: "What does this source establish?" }
    validations: { required: true }
